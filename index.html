<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Czytnik EPUB</title>
<style>
:root{--bg:#fff;--fg:#222;--ui:#f4f4f5;--bd:#d8d8dc;--ac:#2f6fed;--sh:rgba(0,0,0,.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root[data-t=sepia]{--bg:#f4ecd8;--fg:#5b4636;--ui:#eadfc4;--bd:#d6c8a5;--ac:#a0642a}
:root[data-t=dark]{--bg:#1f2227;--fg:#d6d6d6;--ui:#2a2e35;--bd:#3b4049;--ac:#6ea0ff;--sh:rgba(0,0,0,.5)}
:root[data-t=black]{--bg:#000;--fg:#b8b8b8;--ui:#111;--bd:#262626;--ac:#7aa7ff;--sh:rgba(0,0,0,.7)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
header,footer{background:var(--ui);border-color:var(--bd);display:flex;align-items:center;gap:6px;padding:6px 10px;flex:none}
header{border-bottom:1px solid var(--bd)}footer{border-top:1px solid var(--bd);gap:12px}
.ib{background:none;border:1px solid transparent;border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.ib:hover{background:var(--bd)}.ib.on{color:var(--ac);border-color:var(--ac)}
#title{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;min-width:0}
main{flex:1;position:relative;min-height:0;display:flex;justify-content:center}
#wrap{width:100%;max-width:900px;height:100%;position:relative}
#viewer{width:100%;height:100%}
.nav{position:absolute;top:0;bottom:0;width:12%;max-width:90px;background:none;border:0;cursor:pointer;font-size:28px;opacity:0;transition:.2s;color:var(--fg);z-index:5}
.nav:hover{opacity:.5}#prev{left:0}#next{right:0}
#welcome{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;background:var(--bg)}
#drop{border:2px dashed var(--bd);border-radius:16px;padding:48px 36px;text-align:center;max-width:90%;cursor:pointer}
#drop.over{border-color:var(--ac);background:var(--ui)}
#drop h1{margin:0 0 8px;font-size:22px}#drop p{margin:6px 0;opacity:.7}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;margin-top:12px}
#prog{flex:1;accent-color:var(--ac)}#pct{min-width:120px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;opacity:.8}
aside{position:absolute;top:0;bottom:0;left:0;width:340px;max-width:92%;background:var(--ui);border-right:1px solid var(--bd);box-shadow:4px 0 16px var(--sh);z-index:20;display:none;flex-direction:column}
aside.open{display:flex}
.tabs{display:flex;border-bottom:1px solid var(--bd)}
.tabs button{flex:1;padding:10px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.pane{flex:1;overflow:auto;padding:8px;display:none}.pane.on{display:block}
.it{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer}
.it:hover{background:var(--bd)}.it small{display:block;opacity:.65;margin-top:2px}
.sub{margin-left:14px}
.row{display:flex;gap:6px;align-items:center}.row .it{flex:1}
.x{background:none;border:0;cursor:pointer;opacity:.6;padding:6px}
#q{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin-bottom:8px}
#set{position:absolute;top:8px;right:8px;width:310px;max-width:calc(100% - 16px);background:var(--ui);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px var(--sh);padding:14px;z-index:30;display:none}
#set.open{display:block}
#set label{display:block;font-size:12px;opacity:.75;margin:10px 0 4px}
#set select,#set input[type=range]{width:100%}#set select{padding:6px;background:var(--bg);border:1px solid var(--bd);border-radius:6px}
#set input[type=range]{accent-color:var(--ac)}
.sw{display:flex;gap:8px}.sw button{flex:1;height:36px;border-radius:8px;border:2px solid var(--bd);cursor:pointer;font-size:13px}
.sw button.on{border-color:var(--ac)}
.empty{opacity:.6;padding:12px;text-align:center}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.3s;z-index:50}
#toast.show{opacity:.92}
</style>
</head>
<body>
<header>
  <button class="ib" id="bMenu" title="Spis treści, zakładki, szukanie">☰ Menu</button>
  <div id="title">Czytnik EPUB</div>
  <button class="ib" id="bMark" title="Dodaj zakładkę (B)">🔖</button>
  <button class="ib" id="bSet" title="Ustawienia">Aa</button>
  <button class="ib" id="bFull" title="Pełny ekran (F)">⛶</button>
  <button class="ib" id="bOpen" title="Otwórz plik">📂</button>
</header>
<main>
  <div id="wrap">
    <div id="viewer"></div>
    <button class="nav" id="prev" aria-label="Poprzednia strona">‹</button>
    <button class="nav" id="next" aria-label="Następna strona">›</button>
  </div>
  <aside id="side">
    <div class="tabs"><button data-p="toc" class="on">Spis</button><button data-p="bm">Zakładki</button><button data-p="se">Szukaj</button></div>
    <div class="pane on" id="toc"><div class="empty">Otwórz książkę, aby zobaczyć spis treści.</div></div>
    <div class="pane" id="bm"><div class="empty">Brak zakładek.</div></div>
    <div class="pane" id="se"><input id="q" placeholder="Szukaj w książce i naciśnij Enter"><div id="res"></div></div>
  </aside>
  <div id="set">
    <label>Rozmiar czcionki: <span id="fsv"></span>%</label>
    <input type="range" id="fs" min="70" max="250" step="5">
    <label>Czcionka</label>
    <select id="ff">
      <option value="">Oryginalna z książki</option>
      <option value="Georgia, serif">Georgia</option>
      <option value="Palatino Linotype, Palatino, serif">Palatino</option>
      <option value="Times New Roman, Times, serif">Times</option>
      <option value="Arial, Helvetica, sans-serif">Arial</option>
      <option value="Verdana, sans-serif">Verdana</option>
      <option value="Trebuchet MS, sans-serif">Trebuchet</option>
      <option value="Courier New, monospace">Courier</option>
    </select>
    <label>Interlinia: <span id="lhv"></span></label>
    <input type="range" id="lh" min="1.1" max="2.4" step="0.1">
    <label>Szerokość tekstu</label>
    <input type="range" id="wd" min="400" max="1200" step="50">
    <label>Tło</label>
    <div class="sw" id="th">
      <button data-t="light" style="background:#fff;color:#222">Jasne</button>
      <button data-t="sepia" style="background:#f4ecd8;color:#5b4636">Sepia</button>
      <button data-t="dark" style="background:#1f2227;color:#d6d6d6">Ciemne</button>
      <button data-t="black" style="background:#000;color:#b8b8b8">Czarne</button>
    </div>
    <label>Tryb czytania</label>
    <select id="fl"><option value="paginated">Strony (lewo/prawo)</option><option value="scrolled-doc">Przewijanie</option></select>
  </div>
  <div id="welcome">
    <div id="drop">
      <h1>📚 Czytnik EPUB</h1>
      <p>Przeciągnij tutaj plik .epub lub kliknij, aby go wybrać.</p>
      <p>Strzałki ← → przewracają strony, B dodaje zakładkę.</p>
      <button class="btn">Wybierz plik</button>
    </div>
  </div>
</main>
<footer>
  <input type="range" id="prog" min="0" max="1000" value="0" disabled>
  <div id="pct">–</div>
</footer>
<input type="file" id="file" accept=".epub,application/epub+zip" hidden>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=Object.assign({fs:100,ff:'',lh:1.6,wd:800,t:'light',fl:'paginated'},store.get('epub:settings',{}));
let book=null,rend=null,key='',marks=[],cur=null,ready=false;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

const THEMES={light:['#ffffff','#222222'],sepia:['#f4ecd8','#5b4636'],dark:['#1f2227','#d6d6d6'],black:['#000000','#b8b8b8']};
function applyUI(){
  document.documentElement.dataset.t=S.t;
  $('#fs').value=S.fs;$('#fsv').textContent=S.fs;$('#ff').value=S.ff;
  $('#lh').value=S.lh;$('#lhv').textContent=S.lh;$('#wd').value=S.wd;$('#fl').value=S.fl;
  $$('#th button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.t));
  $('#wrap').style.maxWidth=S.wd+'px';
}
function applyBook(){
  if(!rend)return;
  const [bg,fg]=THEMES[S.t];
  rend.themes.fontSize(S.fs+'%');
  rend.themes.override('background',bg,true);
  rend.themes.override('color',fg,true);
  rend.themes.override('line-height',String(S.lh),true);
  if(S.ff)rend.themes.override('font-family',S.ff,true);else rend.themes.removeOverride('font-family');
  rend.themes.default({'a':{color:'inherit !important'},'img':{'max-width':'100% !important'}});
}
function save(){store.set('epub:settings',S)}
applyUI();

// settings events
$('#fs').oninput=e=>{S.fs=+e.target.value;applyUI();applyBook();save()};
$('#ff').onchange=e=>{S.ff=e.target.value;applyBook();save()};
$('#lh').oninput=e=>{S.lh=+e.target.value;applyUI();applyBook();save()};
$('#wd').oninput=e=>{S.wd=+e.target.value;applyUI();save();if(rend)rend.resize()};
$$('#th button').forEach(b=>b.onclick=()=>{S.t=b.dataset.t;applyUI();applyBook();save()});
$('#fl').onchange=e=>{S.fl=e.target.value;if(rend){rend.flow(S.fl);rend.display(cur?cur.start.cfi:undefined)}save();
  $('.nav',document).style.display='';$$('.nav').forEach(n=>n.style.display=S.fl==='paginated'?'':'none')};
$('#bSet').onclick=e=>{e.stopPropagation();$('#set').classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('#set')&&!e.target.closest('#bSet'))$('#set').classList.remove('open')});

// side panel
$('#bMenu').onclick=()=>$('#side').classList.toggle('open');
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$$('.pane').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p));if(b.dataset.p==='se')$('#q').focus()});

// open file
function pick(){$('#file').click()}
$('#bOpen').onclick=pick;$('#drop').onclick=pick;
$('#file').onchange=e=>{if(e.target.files[0])openFile(e.target.files[0]);e.target.value=''};
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.add('over')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.remove('over')}));
document.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)openFile(f)});

async function openFile(file){
  try{
    const buf=await file.arrayBuffer();
    if(book){try{book.destroy()}catch(e){}}
    $('#viewer').innerHTML='';ready=false;cur=null;
    book=ePub(buf);
    const meta=await book.loaded.metadata;
    key='epub:'+(meta.identifier||'')+'|'+(meta.title||file.name);
    $('#title').textContent=(meta.title||file.name)+(meta.creator?' – '+meta.creator:'');
    document.title=meta.title||'Czytnik EPUB';
    marks=store.get(key+':marks',[]);renderMarks();
    rend=book.renderTo('viewer',{width:'100%',height:'100%',flow:S.fl,spread:'none',allowScriptedContent:false});
    applyBook();
    bindRend();
    const pos=store.get(key+':pos',null);
    await rend.display(pos||undefined);
    $('#welcome').style.display='none';
    $$('.nav').forEach(n=>n.style.display=S.fl==='paginated'?'':'none');
    book.loaded.navigation.then(n=>renderToc(n.toc));
    $('#pct').textContent='Indeksowanie…';
    book.ready.then(()=>book.locations.generate(1200)).then(()=>{ready=true;$('#prog').disabled=false;if(cur)upd(cur)}).catch(()=>{});
  }catch(err){toast('Nie udało się otworzyć pliku EPUB');console.error(err)}
}

function bindRend(){
  rend.on('relocated',loc=>{cur=loc;store.set(key+':pos',loc.start.cfi);upd(loc)});
  rend.on('keyup',keys);
  let sx=0,sy=0;
  rend.on('touchstart',e=>{sx=e.changedTouches[0].screenX;sy=e.changedTouches[0].screenY});
  rend.on('touchend',e=>{if(S.fl!=='paginated')return;const dx=e.changedTouches[0].screenX-sx,dy=e.changedTouches[0].screenY-sy;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?rend.next():rend.prev()}});
}
function upd(loc){
  let txt='';
  if(ready){const p=book.locations.percentageFromCfi(loc.start.cfi);$('#prog').value=Math.round(p*1000);txt=Math.round(p*100)+'%';
    const n=book.locations.locationFromCfi(loc.start.cfi),t=book.locations.length();if(typeof n==='number')txt+=' · '+(n+1)+'/'+t}
  $('#pct').textContent=txt||'–';
  $('#bMark').classList.toggle('on',isMarked(loc)>=0);
}
$('#prog').oninput=e=>{if(!ready)return;const cfi=book.locations.cfiFromPercentage(e.target.value/1000);rend.display(cfi)};

// nav
function keys(e){
  if(e.target&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' ')rend&&rend.next();
  else if(k==='ArrowLeft'||k==='PageUp')rend&&rend.prev();
  else if(k==='b'||k==='B')toggleMark();
  else if(k==='f'||k==='F')fs();
  else if(k==='Escape'){$('#side').classList.remove('open');$('#set').classList.remove('open')}
}
document.addEventListener('keyup',keys);
$('#next').onclick=()=>rend&&rend.next();
$('#prev').onclick=()=>rend&&rend.prev();
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}
$('#bFull').onclick=fs;

// toc
function renderToc(items){
  const box=$('#toc');box.innerHTML='';
  if(!items||!items.length){box.innerHTML='<div class="empty">Ta książka nie ma spisu treści.</div>';return}
  (function build(list,parent,lvl){list.forEach(it=>{
    const b=document.createElement('button');b.className='it'+(lvl?' sub':'');b.textContent=(it.label||'').trim();
    b.style.marginLeft=lvl*14+'px';
    b.onclick=()=>{rend.display(it.href);if(innerWidth<700)$('#side').classList.remove('open')};
    parent.appendChild(b);if(it.subitems&&it.subitems.length)build(it.subitems,parent,lvl+1)})})(items,box,0);
}

// bookmarks
function isMarked(loc){
  if(!loc||!marks.length)return -1;
  const c=new ePub.CFI();
  return marks.findIndex(m=>{try{return c.compare(m.cfi,loc.start.cfi)>=0&&c.compare(m.cfi,loc.end.cfi)<=0}catch(e){return m.cfi===loc.start.cfi}});
}
function chapterOf(loc){
  try{const it=book.navigation.get(loc.start.href);return it?it.label.trim():''}catch(e){return ''}
}
function toggleMark(){
  if(!cur){return}
  const i=isMarked(cur);
  if(i>=0){marks.splice(i,1);toast('Usunięto zakładkę')}
  else{
    const pct=ready?Math.round(book.locations.percentageFromCfi(cur.start.cfi)*100)+'%':'';
    marks.push({cfi:cur.start.cfi,label:chapterOf(cur)||'Zakładka',pct,date:new Date().toLocaleString('pl-PL')});
    toast('Dodano zakładkę');
  }
  store.set(key+':marks',marks);renderMarks();upd(cur);
}
$('#bMark').onclick=toggleMark;
function renderMarks(){
  const box=$('#bm');box.innerHTML='';
  if(!marks.length){box.innerHTML='<div class="empty">Brak zakładek. Naciśnij 🔖 lub klawisz B.</div>';return}
  marks.forEach((m,i)=>{
    const r=document.createElement('div');r.className='row';
    const b=document.createElement('button');b.className='it';
    b.innerHTML=esc(m.label)+'<small>'+esc(m.pct||'')+' · '+esc(m.date)+'</small>';
    b.onclick=()=>{rend.display(m.cfi);if(innerWidth<700)$('#side').classList.remove('open')};
    const x=document.createElement('button');x.className='x';x.textContent='✕';x.title='Usuń';
    x.onclick=()=>{marks.splice(i,1);store.set(key+':marks',marks);renderMarks();if(cur)upd(cur)};
    r.append(b,x);box.appendChild(r);
  });
}

// search
$('#q').onkeydown=async e=>{
  if(e.key!=='Enter'||!book)return;
  const q=e.target.value.trim();if(!q)return;
  const res=$('#res');res.innerHTML='<div class="empty">Szukam…</div>';
  try{
    await book.ready;
    const all=await Promise.all(book.spine.spineItems.map(it=>it.load(book.load.bind(book)).then(it.find.bind(it,q)).catch(()=>[]).finally(()=>it.unload())));
    const hits=[].concat(...all);
    res.innerHTML='';
    if(!hits.length){res.innerHTML='<div class="empty">Brak wyników.</div>';return}
    hits.slice(0,200).forEach(h=>{
      const b=document.createElement('button');b.className='it';
      const ex=esc(h.excerpt.trim()),qq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      b.innerHTML=ex.replace(new RegExp(qq,'gi'),m=>'<mark>'+m+'</mark>');
      b.onclick=()=>{rend.display(h.cfi);if(innerWidth<700)$('#side').classList.remove('open')};
      res.appendChild(b);
    });
  }catch(err){res.innerHTML='<div class="empty">Błąd wyszukiwania.</div>'}
};
})();
</script>
</body>
</html>
